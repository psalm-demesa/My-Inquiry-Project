<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="The Support Space Logo.png" type="image/x-icon" alt="Website Logo generated by ChatGPT">
    <title>The Support Space</title>
</head>
<body>
<header>
        <nav class="navbar">
            <div class="logo">♡</div>
              <button class="menu-btn" onclick="toggleMenu()">
        ☰
    </button>
            <ul id="nav-links" class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="resources.html">Resources & Support</a></li>
            </ul>
        </nav>
    </header>
    
    <!-- Main Content -->
     <header class="main-header">
        <section class="welcome-section">
            <h1>Games and Relaxing Tools</h1>
            <p>Explore our collection of games and relaxing activities to help you unwind and have fun!</p>
        </section>
         <div>
        <svg
          class="waves"
          xmlns="http://www.w3.org/2000/svg"
          xmlns:xlink="http://www.w3.org/1999/xlink"
          viewBox="0 24 150 28"
          preserveAspectRatio="none"
          shape-rendering="auto"
        >
          <defs>
            <path
              id="gentle-wave"
              d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z"
            />
          </defs>
          <g class="parallax">
            <use
              xlink:href="#gentle-wave"
              x="48"
              y="0"
              fill="rgba(255,255,255,0.7)"
            />
            <use
              xlink:href="#gentle-wave"
              x="48"
              y="3"
              fill="rgba(255,255,255,0.5)"
            />
            <use
              xlink:href="#gentle-wave"
              x="48"
              y="5"
              fill="rgba(255,255,255,0.3)"
            />
            <use xlink:href="#gentle-wave" x="48" y="7" fill="#fff" />
          </g>
        </svg>
      </div>
     </header>
</head>

<body>

<!-- Game content -->
<section class="game-section">
    <button onclick="openPopup('snake')">
        🐍 Snake
    </button>

    <button onclick="openPopup('wordle')">
        🔤 Wordle
    </button>

    <button onclick="openPopup('rps')">
        ✂️ Rock Paper Scissors
    </button>




        <!-- SNAKE -->

        <div id="snake" class="snake-popup">

            <div class="snake-popup-content">

                <span class="close"
                    onclick="closePopup('snake')">&times;</span>


                <h2>Snake</h2>


                <canvas id="game" width="300" height="300"></canvas>


            </div>

        </div>




        <!-- WORDLE -->

        <div id="wordle" class="wordle-popup">

            <div class="wordle-popup-content">

                <span class="close" onclick="closePopup('wordle')">
                    X
                </span>


                <h2>Wordle</h2>


                <p>
                    Guess: <b>CODE</b>
                </p>


                <input id="guess" maxlength="4">


                <button onclick="checkWord()">
                    Check
                </button>


                <p id="wordleResult"></p>


            </div>

        </div>





        <!-- RPS -->

        <div id="rps" class="rps-popup">

            <div class="rps-popup-content">

                <span class="close" onclick="closePopup('rps')">
                    X
                </span>


                <h2>
                    Rock Paper Scissors
                </h2>


                <button onclick="play('rock')">
                    Rock
                </button>


                <button onclick="play('paper')">
                    Paper
                </button>


                <button onclick="play('scissors')">
                    Scissors
                </button>


                <p id="rpsResult"></p>


            </div>

        </div>
</section>
<script src="game.js"></script>
</body>
</html>
